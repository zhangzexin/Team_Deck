name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Android code
        run: >-
          ./gradlew --stacktrace
          :shared:testDebugUnitTest
          :androidApp:testDebugUnitTest
          :desktopplugin:testDebugUnitTest
          :imageplugin:testDebugUnitTest
          :systemmonitorplugin:testDebugUnitTest
          :androidstudioplugin:testDebugUnitTest
          :scriptexecutorplugin:testDebugUnitTest
          :deckplugin:testDebugUnitTest

      - name: Build Android apps and plugins
        run: >-
          ./gradlew --stacktrace
          :androidApp:assembleDebug
          :desktopplugin:assembleDebug
          :desktopplugin:packageUniversalApk
          :imageplugin:assembleDebug
          :imageplugin:packageUniversalApk
          :systemmonitorplugin:assembleDebug
          :androidstudioplugin:assembleDebug
          :scriptexecutorplugin:assembleDebug
          :deckplugin:assembleDebug

      - name: Build release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          ./gradlew --stacktrace
          :androidApp:assembleRelease
          :desktopplugin:assembleRelease
          :imageplugin:assembleRelease
          :systemmonitorplugin:assembleRelease
          :androidstudioplugin:assembleRelease
          :scriptexecutorplugin:assembleRelease
          :deckplugin:assembleRelease

      - name: Decode Android signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "${ANDROID_SIGNING_KEY}"
          printf '%s' "${ANDROID_SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/team-deck-release.jks"
          chmod 600 "${RUNNER_TEMP}/team-deck-release.jks"

      - name: Sign and verify release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort | tail -n 1)"
          test -x "${apksigner}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          mkdir -p build-artifacts

          sign_apk() {
            input="$1"
            output="$2"
            test -f "${input}"
            "${apksigner}" sign \
              --ks "${RUNNER_TEMP}/team-deck-release.jks" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "${output}" \
              "${input}"
            "${apksigner}" verify --verbose --print-certs "${output}"
          }

          sign_apk androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk build-artifacts/TeamDeck-android-release.apk
          sign_apk desktopplugin/build/outputs/apk/release/desktopplugin-release-unsigned.apk build-artifacts/desktopplugin-release.apk
          sign_apk desktopplugin/build/libs/universal-plugin.apk build-artifacts/desktopplugin-universal-release.apk
          sign_apk imageplugin/build/outputs/apk/release/imageplugin-release-unsigned.apk build-artifacts/imageplugin-release.apk
          sign_apk imageplugin/build/libs/universal-image-plugin.apk build-artifacts/imageplugin-universal-release.apk
          sign_apk systemmonitorplugin/build/outputs/apk/release/systemmonitorplugin-release-unsigned.apk build-artifacts/systemmonitorplugin-release.apk
          sign_apk androidstudioplugin/build/outputs/apk/release/androidstudioplugin-release-unsigned.apk build-artifacts/androidstudioplugin-release.apk
          sign_apk scriptexecutorplugin/build/outputs/apk/release/scriptexecutorplugin-release-unsigned.apk build-artifacts/scriptexecutorplugin-release.apk
          sign_apk deckplugin/build/outputs/apk/release/deckplugin-release-unsigned.apk build-artifacts/deckplugin-release.apk

      - name: Collect debug Android artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p build-artifacts
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk build-artifacts/
          cp desktopplugin/build/outputs/apk/debug/desktopplugin-debug.apk build-artifacts/
          cp desktopplugin/build/libs/universal-plugin.apk build-artifacts/
          cp imageplugin/build/outputs/apk/debug/imageplugin-debug.apk build-artifacts/
          cp imageplugin/build/libs/universal-image-plugin.apk build-artifacts/
          cp systemmonitorplugin/build/outputs/apk/debug/systemmonitorplugin-debug.apk build-artifacts/
          cp androidstudioplugin/build/outputs/apk/debug/androidstudioplugin-debug.apk build-artifacts/
          cp scriptexecutorplugin/build/outputs/apk/debug/scriptexecutorplugin-debug.apk build-artifacts/
          cp deckplugin/build/outputs/apk/debug/deckplugin-debug.apk build-artifacts/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: build-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS desktop
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test desktop code
        run: ./gradlew --stacktrace :shared:desktopTest :desktopApp:jvmTest

      - name: Build macOS package
        run: ./gradlew --stacktrace :desktopApp:jvmJar :desktopApp:packageDmg

      - name: Collect macOS artifacts
        run: |
          mkdir -p build-artifacts
          cp desktopApp/build/libs/*.jar build-artifacts/
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg build-artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-${{ github.sha }}
          path: build-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Android APKs are release-key signed. The macOS DMG is unsigned and not notarized." \
              --generate-notes \
              --prerelease
          fi
